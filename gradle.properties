# Gradle JVM settings for the RoboVM AOT build.
#
# Why this file exists
# --------------------
# RoboVM's AOT compiler (org.robovm.compiler.AppCompiler) runs *in-process* in
# the Gradle daemon. With `--no-daemon` Gradle forks a single-use daemon, and
# on JDK 8 that fork defaults to a 512 MB max heap.
#
# 512 MB is nowhere near enough for this app: 1266 game classes, ~800 libGDX
# classes, plus the MetalANGLE bindings. The first CI run showed exactly what
# happens — the daemon logged
#
#     Expiring Daemon because JVM heap space is exhausted
#
# once every 10-30 s for 52 minutes with zero build progress, then hit the job
# timeout. No OutOfMemoryError was thrown because GC kept limping along; the
# build just never finished.
#
# 4 GB is sized for the 7 GB macos-15 (arm64) runner: enough for the AOT heap,
# with room left for the clang processes RoboVM spawns to assemble the
# generated LLVM IR.
#
# If you build on a machine with less RAM, lower Xmx — but not below 2 GB.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8

# Parallel project execution buys nothing here: the task graph is a straight
# line (core26 -> jar -> ios26scene -> createIPA) and running two JVMs would
# split the available RAM.
org.gradle.parallel=false

# RoboVM reads the whole resource tree (1698 files) on every run, so a
# configuration-cache hit is rare and the cache just adds noise.
org.gradle.caching=false

# Keep the console readable in CI logs.
org.gradle.console=plain
