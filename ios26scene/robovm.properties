# RoboVM 属性文件 —— 填 Info.plist.xml 和 robovm-ios26.xml 里的 ${...} 占位符。
#
# 加载顺序（Config$Builder 硬编码，后面的覆盖前面的）：
#   robovm.properties  ->  robovm.local.properties  ->  robovm.test.properties
#
# 只有三个键会被识别，别的名字写在这里不会生效：
#   app.id          -> CFBundleIdentifier
#   app.name        -> CFBundleName
#   app.executable  -> CFBundleExecutable
#
# app.id 必须和 provisioning profile 里的 App ID 完全一致，否则签名失败。
# 改成你自己的反向域名，或者在命令行覆盖：
#   gradle :ios26:createIPA -Probovm.app.id=com.yourorg.veggies3

app.id=com.soco.veggies3_4399
app.name=Veggies3HD
app.executable=Veggies3HD
