name: build-ios26-ipa

# Builds the iOS 26.3 IPA on a GitHub-hosted macOS runner.
#
# Why CI: RoboVM's AOT compiler only runs on macOS with JDK 8, and the person
# doing the port has a Windows box. A `macos-15` runner has Xcode preinstalled
# and is free for public repos, so this is the cheapest way to get a real .ipa
# without owning a Mac.
#
# What you get: an unsigned IPA as a build artifact. That is enough to install
# on a *jailbroken* device or run in the Simulator. For a normal iPhone you still
# need a signing certificate — see .github/SIGNING.md.

on:
  workflow_dispatch:
    inputs:
      flavour:
        description: 'Which flavour to build'
        required: true
        default: 'ios26scene'
        type: choice
        options:
          - ios26scene   # UIScene lifecycle, iOS 27 ready (recommended)
          - ios26        # legacy UIApplicationDelegate, iOS 26 only

jobs:
  build:
    # macos-15 ships Xcode 16, which can target the iOS 26 SDK.
    # macos-14 also works; pin explicitly so the toolchain does not drift.
    runs-on: macos-15
    # The AOT compile of 1266 classes plus the MetalANGLE bindings takes 20-40
    # minutes cold. 90 leaves headroom for a slow runner without letting a hung
    # build burn an hour of quota silently — which is exactly what run #1 did
    # (see the heap note below).
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # RoboVM 2.3.19 uses com.sun.javadoc / tools.jar interfaces that were
      # removed in JDK 9. There is no way around JDK 8.
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '8'

      - name: Show toolchain
        run: |
          java -version
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      # The archive ships NTFS junctions (ios26/libs -> ios/libs etc.) which do
      # not survive a git checkout. Rebuild them as real symlinks.
      - name: Relink shared directories
        run: |
          chmod +x setupLinks.sh gradlew
          ./setupLinks.sh

      # The RoboVM AOT compiler's object cache (~/.robovm/cache) survives between
      # runs via actions/cache. Run #3 showed the per-class javac->LLVM stage
      # only takes ~8 min (1843 classes); the other 73+ silent minutes are the
      # post-compile link/LLVM-opt phase, which caches per-class .o files. A
      # warm cache can cut that phase dramatically on repeat runs.
      - name: Cache RoboVM object cache
        uses: actions/cache@v4
        with:
          path: ~/.robovm/cache
          key: robovm-cache-${{ inputs.flavour }}-${{ hashFiles('libs/*.jar', 'core/src/**/*.java', 'ios26/src/**/*.java', 'ios26scene/src/**/*.java') }}
          restore-keys: |
            robovm-cache-${{ inputs.flavour }}-

      # Runs #3/#4 both went completely silent for 73/79 minutes after the
      # 10-minute "Compiling ..." phase — no log line at all until the 90-min
      # timeout cancelled the job, so it is impossible to tell whether the
      # hang is in LLVM opt, linking, or something else. This sampler writes
      # process tables + java stack samples into the workspace, which the
      # always() upload below then captures even on cancel.
      - name: Sample hung build
        run: |
          chmod +x tools/ci_sample.sh
          nohup ./tools/ci_sample.sh >/dev/null 2>&1 &

      - name: Build IPA
        run: |
          # gradle.properties sets -Xmx4g for the daemon. That file matters: the
          # RoboVM AOT compiler runs *inside* the daemon JVM, and the default
          # fork on JDK 8 is 512 MB.
          #
          # --info is not noise here. RoboVM routes its Logger through Gradle's
          # logger, and ConsoleLogger only prints info() when verbose — so at the
          # default LIFECYCLE level the only AOT output is warn/error. Run #2
          # showed exactly that: createIPA sat for 89 minutes with a completely
          # empty log, which is indistinguishable from a hang. --info surfaces
          # "Compiling classes using N threads", "Compiled N classes in X
          # seconds" and "Linked N classes in X seconds", which is what tells us
          # whether the tree shaker is making progress.
          echo "--- effective JVM args ---"
          cat gradle.properties
          ./gradlew --no-daemon --stacktrace --info \
            :${{ inputs.flavour }}:createIPA

      - name: Locate artifact
        id: find
        run: |
          set -e
          IPA=$(find . -name '*.ipa' -type f | head -n1)
          if [ -z "$IPA" ]; then
            echo "::error::no .ipa produced — dumping build dir for diagnosis"
            find . -path ./offline-repo -prune -o -name 'build' -type d -print
            exit 1
          fi
          echo "ipa=$IPA" >> "$GITHUB_OUTPUT"
          ls -lh "$IPA"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Veggies3HD-${{ inputs.flavour }}-unsigned
          path: ${{ steps.find.outputs.ipa }}
          retention-days: 14

      # The RoboVM AOT log is the only place that says *why* a link failed.
      # `always()` rather than `failure()`: a timeout shows up as `cancelled`,
      # which skips failure-only steps. Run #2 produced zero diagnostics for
      # exactly that reason.
      #
      # Glob note (run #3): RoboVM's intermediate objects do NOT live under
      # build/robovm/ — the gradle plugin runs the compiler with the project
      # dir as cwd and the object cache is ~/.robovm/cache. So we upload the
      # cache dir tree listing plus any object/archive files actually present
      # in the workspace instead of guessing at log paths.
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.run_number }}
          path: |
            **/*.log
            build-diagnostics/**
            **/*.o
            **/*.a
            !**/offline-repo/**
            !**/.gradle/**
          retention-days: 7
          if-no-files-found: ignore

      # Even when nothing matched above, a plain listing of where RoboVM put
      # things is enough to point the next fix at the right directory.
      - name: Dump RoboVM work dirs
        if: always()
        run: |
          echo "=== ~/.robovm/cache tree (top 2 levels) ==="
          find ~/.robovm/cache -maxdepth 2 2>/dev/null | head -n 80 || true
          echo "=== workspace object/archive files ==="
          find . -path ./offline-repo -prune -o \( -name '*.o' -o -name '*.a' -o -name '*.ipa' -o -name 'robovm.xml' \) -print 2>/dev/null | head -n 60 || true
          echo "=== gradle daemon log tail ==="
          tail -n 100 ~/.gradle/daemon/*/*.log 2>/dev/null || ls ~/.gradle/daemon 2>/dev/null || true
